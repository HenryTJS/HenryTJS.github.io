<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="整数性质实验室：查询整数的特殊性质，以及特殊数在指定范围内的取值。">
    <title>整数性质实验室 | seal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="main-nav-bar" id="mainNavBar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <span class="logo-icon">S</span>
                <span>seal</span>
            </a>
            <ul class="nav-links">
                <li><a href="/"><i class="fas fa-home"></i><span>首页</span></a></li>
                <li><a href="/article"><i class="fas fa-book"></i><span>阅读</span></a></li>
                <li><a href="/math/" class="active"><i class="fas fa-calculator"></i><span>数学</span></a></li>
                <li><a href="/trip"><i class="fas fa-map-marker-alt"></i><span>足迹</span></a></li>
                <li><a href="/information"><i class="fas fa-link"></i><span>链接</span></a></li>
            </ul>
        </div>
    </nav>

    <main class="page-shell">
        <section class="intro reveal">
            <p class="eyebrow">NUMBER LAB / 01</p>
            <h1>让每一个整数<br><em>显露它的结构。</em></h1>
            <p class="intro-copy">输入一个正整数，检查它属于哪些特殊类型；也可以选定一种数，在指定范围内寻找它们。</p>
        </section>

        <section class="workspace reveal" aria-label="整数查询工具">
            <div class="mode-tabs" role="tablist" aria-label="查询模式">
                <button class="mode-tab active" id="propertyTab" role="tab" aria-selected="true" aria-controls="propertyPanel">
                    <span class="tab-number">01</span>
                    查询整数性质
                </button>
                <button class="mode-tab" id="rangeTab" role="tab" aria-selected="false" aria-controls="rangePanel">
                    <span class="tab-number">02</span>
                    查询特殊数范围
                </button>
            </div>

            <div class="mode-panel active" id="propertyPanel" role="tabpanel" aria-labelledby="propertyTab">
                <div class="panel-heading">
                    <div>
                        <p class="section-kicker">SINGLE NUMBER</p>
                        <h2>这个数有什么性质？</h2>
                    </div>
                    <p class="panel-note">支持任意长度的正整数</p>
                </div>
                <form class="query-form" id="propertyForm">
                    <label class="field wide-field">
                        <span>正整数</span>
                        <input id="numberInput" type="text" inputmode="numeric" placeholder="例如 2025" autocomplete="off">
                    </label>
                    <button class="primary-button" type="submit">开始分析 <span>→</span></button>
                </form>
                <p class="form-error" id="propertyError" role="alert"></p>
                <div class="result-area hidden" id="propertyResult"></div>
            </div>

            <div class="mode-panel" id="rangePanel" role="tabpanel" aria-labelledby="rangeTab" hidden>
                <div class="panel-heading">
                    <div>
                        <p class="section-kicker">RANGE SEARCH</p>
                        <h2>在范围内寻找特殊数</h2>
                    </div>
                    <p class="panel-note">单次最多检查 100 万个整数</p>
                </div>
                <form class="query-form range-form" id="rangeForm">
                    <label class="field type-field">
                        <span>数的类型</span>
                        <select id="typeSelect"></select>
                    </label>
                    <div class="type-params" id="typeParams" hidden></div>
                    <label class="field">
                        <span>从</span>
                        <input id="minInput" type="number" min="1" value="1" inputmode="numeric">
                    </label>
                    <label class="field">
                        <span>到</span>
                        <input id="maxInput" type="number" min="1" value="100" inputmode="numeric">
                    </label>
                    <button class="primary-button" type="submit">搜索范围 <span>→</span></button>
                </form>
                <p class="form-error" id="rangeError" role="alert"></p>
                <div class="result-area hidden" id="rangeResult"></div>
            </div>
        </section>

    </main>

    <footer>
        <div class="footer-content">
            <p>© 2025 seal的个人主页. 保留所有权利.</p>
        </div>
    </footer>

    <script src="js/number-types.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
